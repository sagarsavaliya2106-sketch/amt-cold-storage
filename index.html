<script>
(function () {
  const { useState, useEffect, useMemo, useRef, useCallback } = React;
  const html = htm.bind(React.createElement);

  /* ---------------- helpers ---------------- */
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const DAY = 86400000;
  const TODAY = new Date(2026, 9, 2);
  const safe = n => (typeof n === 'number' && isFinite(n) ? n : 0);
  const fmt = n => Math.round(safe(n)).toLocaleString('en-IN');
  const rs = n => '₹' + fmt(n);
  const iso = d => { const z = new Date(d); return z.getFullYear() + '-' + String(z.getMonth() + 1).padStart(2, '0') + '-' + String(z.getDate()).padStart(2, '0'); };
  const parseIso = s => { const p = String(s || '').split('-').map(Number); return p.length === 3 && p.every(isFinite) ? new Date(p[0], p[1] - 1, p[2]) : TODAY; };
  const daysSince = s => Math.max(0, Math.round((TODAY - parseIso(s)) / DAY));
  const fmtDate = (s, lang) => parseIso(s).toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  const nowTime = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const pad = (n, w) => String(n).padStart(w, '0');
  const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const digits = s => String(s || '').replace(/\D/g, '');
  // Whole positive number from any input ("", "12.5", "-3", "1e3" are rejected).
  const toBags = v => { const s = String(v == null ? '' : v).trim(); if (!/^\d+$/.test(s)) return NaN; return parseInt(s, 10); };
  const toMoney = v => { const s = String(v == null ? '' : v).trim(); if (!/^\d+(\.\d+)?$/.test(s)) return NaN; return parseFloat(s); };
  const RATE = { rent: 130, hamali: 10, bardana: 25, interest: 0.015 };
  // Simple interest: 1.5% per month, counted by days (30-day month), rounded to the rupee.
  const interestOf = a => { const d = daysSince(a.date); const val = a.noInt ? 0 : Math.round(safe(a.amt) * RATE.interest * d / 30); return { days: d, val: safe(val) }; };
  const dur = (d, t) => { const m = Math.floor(d / 30), r = d % 30; return (m ? m + ' ' + t('months') + ' ' : '') + r + ' ' + t('days'); };
  const lotNo = n => 'LOT-' + (1000 + n);

  /* ---------------- plant constants ---------------- */
  const PLANT_CAP = 120000;
  const CH_CAP = 25000;
  const CELL_CAP = 625;
  const FLOORS = 4, GULLAS = 10;
  const CH_TOTAL = [21500, 24000, 18200, 20620];
  const CH_TEMP = [2.8, 3.1, 2.5, 3.0];
  const CH_RH = [90, 92, 88, 91];
  const STORE_KEY = 'amt-demo-v2';

  const COM = {
    safed: { en: 'Safed Aloo', hi: 'सफ़ेद आलू', tag: { en: 'Table', hi: 'टेबल' }, color: '#B88A0B' },
    lal: { en: 'Lal Aloo', hi: 'लाल आलू', tag: { en: 'Table', hi: 'टेबल' }, color: '#C2410C' },
    beej: { en: 'Beej Aloo', hi: 'बीज आलू', tag: { en: 'Seed', hi: 'बीज' }, color: '#0F766E' },
    lahsun: { en: 'Lahsun', hi: 'लहसुन', tag: { en: 'Garlic', hi: 'लहसुन' }, color: '#7C3AED' }
  };
  const CH_MAIN = [
    { en: 'Table Aloo', hi: 'टेबल आलू' }, { en: 'Beej Aloo', hi: 'बीज आलू' },
    { en: 'Aloo + Lahsun', hi: 'आलू + लहसुन' }, { en: 'Mixed Aloo', hi: 'मिक्स आलू' }
  ];

  /* ---------------- sample data (deterministic) ---------------- */
  const rng = mulberry32(20260302);
  const BASE_OWNERS = [
    ['Rameshwar Patel', 'Mauranipur', 3], ['Dharmendra Yadav', 'Bhojpura', 3], ['Bundelkhand Traders', 'Jhansi', 7], ['Kailash Kushwaha', 'Niwari', 3],
    ['Ramkishan Ahirwar', 'Prithvipur', 1], ['Santosh Rajput', 'Orchha', 1], ['Mahesh Lodhi', 'Tikamgarh', 1], ['Shivam Agro', 'Jhansi', 3],
    ['Raju Pal', 'Garautha', 1], ['Govind Kushwaha', 'Babina', 1], ['Brijesh Yadav', 'Niwari', 1], ['Ashok Sahu', 'Prithvipur', 1],
    ['Hariom Patel', 'Mauranipur', 2], ['Mohd. Irfan', 'Jhansi', 1], ['Pappu Rajak', 'Bhojpura', 1], ['Vinod Parihar', 'Orchha', 1],
    ['Lakhan Singh Bundela', 'Jeron', 1], ['Kamlesh Ahirwar', 'Tarichar Kalan', 1], ['Sunil Kushwaha', 'Niwari', 1], ['Rajendra Lodhi', 'Prithvipur', 1],
    ['Gajendra Yadav', 'Bhojpura', 1], ['Maa Sharda Traders', 'Mauranipur', 3], ['Jagdish Pal', 'Babina', 1], ['Om Prakash Sen', 'Niwari', 1],
    ['Devendra Rajput', 'Orchha', 1], ['Jai Kisan Aloo Co.', 'Jhansi', 2], ['Ramesh Ahirwar', 'Jeron', 1], ['Bhagwan Das Kushwaha', 'Garautha', 1],
    ['Naresh Patel', 'Mauranipur', 1], ['Shyam Sundar Yadav', 'Bhojpura', 1], ['Pushpendra Lodhi', 'Tikamgarh', 1], ['Mukesh Kushwaha', 'Prithvipur', 1]
  ].map(([name, village, w], i) => ({ id: i, name, village, w, mobile: String(6 + Math.floor(rng() * 4)) + pad(Math.floor(rng() * 1e9), 9) }));
  const OWNERS = BASE_OWNERS.map(o => ({ ...o }));
  const W_SUM = BASE_OWNERS.reduce((a, o) => a + o.w, 0);
  const pickOwner = () => { let r = rng() * W_SUM; for (const o of BASE_OWNERS) { r -= o.w; if (r <= 0) return o.id; } return 0; };
  const pickCom = (ch, f) => {
    const r = rng();
    if (ch === 0) return r < 0.6 ? 'safed' : 'lal';
    if (ch === 1) return 'beej';
    if (ch === 2) return f === 3 ? 'lahsun' : (r < 0.55 ? 'safed' : 'lal');
    return r < 0.5 ? 'lal' : r < 0.8 ? 'safed' : 'beej';
  };
  const fmtMobile = m => { const d = digits(m); return d.length === 10 ? d.slice(0, 5) + ' ' + d.slice(5) : (d || '—'); };

  function buildInitial() {
    const cells = [], all = [];
    for (let ch = 0; ch < 4; ch++) {
      const rel = Array.from({ length: 40 }, (_, i) => { let b = 0.72 + 0.28 * rng(); if (ch === 2 && Math.floor(i / 10) === 3) b *= 0.55; return b; });
      const s = rel.reduce((a, b) => a + b, 0);
      const vals = rel.map(r => Math.min(620, Math.round(r / s * CH_TOTAL[ch] / 10) * 10));
      let diff = CH_TOTAL[ch] - vals.reduce((a, b) => a + b, 0), i = 0;
      while (diff !== 0 && i < 200000) { const k = i % 40; if (diff > 0 && vals[k] <= 610) { vals[k] += 10; diff -= 10; } else if (diff < 0 && vals[k] >= 60) { vals[k] -= 10; diff += 10; } i++; }
      const chamber = [];
      for (let f = 0; f < FLOORS; f++) {
        const floor = [];
        for (let g = 0; g < GULLAS; g++) {
          const v = vals[f * 10 + g];
          const n = v < 160 ? 1 : (rng() < 0.45 ? 1 : rng() < 0.7 ? 2 : 3);
          const parts = []; let rem = v;
          for (let j = 0; j < n - 1; j++) { let p = Math.round(rem * (0.3 + 0.4 * rng()) / 10) * 10; p = Math.max(50, Math.min(rem - 50 * (n - 1 - j), p)); parts.push(p); rem -= p; }
          parts.push(rem);
          floor.push(parts.filter(p => p > 0).map(p => {
            const lot = { id: '', owner: pickOwner(), bags: p, com: pickCom(ch, f), date: iso(new Date(2026, 1, 10).getTime() + Math.floor(rng() * 74) * DAY) };
            all.push(lot); return lot;
          }));
        }
        chamber.push(floor);
      }
      cells.push(chamber);
    }
    all.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    all.forEach((l, i) => { l.id = lotNo(i + 1); });
    const hasStock = new Set(all.map(l => l.owner));
    const adv = {
      0: [{ date: '2026-05-10', amt: 150000 }],
      1: [{ date: '2026-06-22', amt: 80000 }, { date: '2026-08-14', amt: 40000 }],
      3: [{ date: '2026-04-28', amt: 60000 }]
    };
    BASE_OWNERS.forEach(o => {
      if (o.id < 4 || !hasStock.has(o.id)) return;
      if (rng() < 0.55) adv[o.id] = [{ date: iso(new Date(2026, 4, 1).getTime() + Math.floor(rng() * 110) * DAY), amt: (2 + Math.floor(rng() * 16)) * 10000 }];
    });
    return { cells, adv, nextLot: all.length + 1 };
  }
  const INIT = buildInitial();
  const INIT_EVENTS = [
    { id: 'e9', time: '11:18', type: 'in', owner: 'Kailash Kushwaha', vehicle: 'MP-36 ZB 4417', bags: 620, com: 'safed', place: 'C3 · F2' },
    { id: 'e8', time: '11:05', type: 'pay', owner: 'Bundelkhand Traders', amt: 100000, note: 'RTGS' },
    { id: 'e7', time: '10:52', type: 'out', owner: 'Bundelkhand Traders', vehicle: 'UP-93 T 2208', bags: 500, com: 'beej', place: 'GP-0921' },
    { id: 'e6', time: '10:31', type: 'in', owner: 'Rameshwar Patel', vehicle: 'UP-93 AK 3391', bags: 480, com: 'lal', place: 'C4 · F1' },
    { id: 'e5', time: '10:10', type: 'out', owner: 'Shivam Agro', vehicle: 'UP-93 BT 1180', bags: 400, com: 'safed', place: 'GP-0922' },
    { id: 'e4', time: '09:47', type: 'in', owner: 'Dharmendra Yadav', vehicle: 'MP-36 ZA 1152', bags: 750, com: 'beej', place: 'C2 · F3' },
    { id: 'e3', time: '09:30', type: 'pay', owner: 'Dharmendra Yadav', amt: 68500, note: 'Cash' },
    { id: 'e2', time: '09:12', type: 'out', owner: 'Maa Sharda Traders', vehicle: 'UP-93 AT 7765', bags: 300, com: 'lal', place: 'GP-0923' },
    { id: 'e1', time: '08:40', type: 'in', owner: 'Hariom Patel', vehicle: 'UP-93 AK 0219', bags: 600, com: 'safed', place: 'C1 · F4' }
  ];
  const freshState = () => ({
    cells: JSON.parse(JSON.stringify(INIT.cells)),
    adv: JSON.parse(JSON.stringify(INIT.adv)),
    events: INIT_EVENTS.map(e => ({ ...e })),
    nextLot: INIT.nextLot,
    counters: { bill: 457, gp: 924 },
    extra: []
  });

  /* ---------------- persistence (this browser only) ---------------- */
  function validState(s) {
    try {
      if (!s || s.v !== 2) return false;
      if (!Array.isArray(s.extra) || !Array.isArray(s.events) || !s.adv || typeof s.adv !== 'object') return false;
      if (!(Number.isInteger(s.nextLot) && s.nextLot > 0) || !s.counters || !(s.counters.bill > 0) || !(s.counters.gp > 0)) return false;
      const maxOwner = BASE_OWNERS.length + s.extra.length;
      if (!Array.isArray(s.cells) || s.cells.length !== 4) return false;
      for (const ch of s.cells) {
        if (!Array.isArray(ch) || ch.length !== FLOORS) return false;
        for (const f of ch) {
          if (!Array.isArray(f) || f.length !== GULLAS) return false;
          for (const g of f) {
            if (!Array.isArray(g) || cellSum(g) > CELL_CAP) return false;
            for (const l of g) if (!l || typeof l.id !== 'string' || !(Number.isInteger(l.bags) && l.bags > 0) || !COM[l.com] || !(Number.isInteger(l.owner) && l.owner >= 0 && l.owner < maxOwner)) return false;
          }
        }
      }
      for (const k in s.adv) { if (!Array.isArray(s.adv[k])) return false; for (const a of s.adv[k]) if (!a || !(a.amt >= 0) || typeof a.date !== 'string') return false; }
      return true;
    } catch (e) { return false; }
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) { const s = JSON.parse(raw); if (validState(s)) return s; }
    } catch (e) { }
    return null;
  }
  function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify({ v: 2, ...s })); return true; } catch (e) { return false; } }
  function applyExtraOwners(extra) {
    OWNERS.length = BASE_OWNERS.length;
    BASE_OWNERS.forEach((o, i) => { OWNERS[i] = { ...o }; });
    (extra || []).forEach(o => { OWNERS.push({ id: OWNERS.length, name: String((o && o.name) || '—'), village: (o && o.village) || '—', w: 0, mobile: (o && o.mobile) || '' }); });
  }

  /* ---------------- stock math ---------------- */
  function cellSum(lots) { return lots.reduce((a, l) => a + safe(l && l.bags), 0); }
  const chamberSum = ch => ch.reduce((a, f) => a + f.reduce((b, g) => b + cellSum(g), 0), 0);
  const cloneCells = c => c.map(ch => ch.map(f => f.map(g => g.map(l => ({ ...l })))));
  // Fill from a starting gulla onward (same chamber), spilling into the next gullas/floors.
  function allocate(cells, ch, f0, g0, bags) {
    const order = [];
    for (let f = 0; f < FLOORS; f++) for (let g = 0; g < GULLAS; g++) order.push([f, g]);
    let start = order.findIndex(([f, g]) => f === f0 && g === g0); if (start < 0) start = 0;
    const seq = order.slice(start).concat(order.slice(0, start));
    const out = []; let rem = bags;
    for (const [f, g] of seq) {
      if (rem <= 0) break;
      const free = CELL_CAP - cellSum(cells[ch][f][g]);
      if (free <= 0) continue;
      const n = Math.min(free, rem); out.push({ f, g, n }); rem -= n;
    }
    return rem > 0 ? null : out;
  }
  function bestStart(cells, ch) {
    let best = { f: 0, g: 0 }, bf = -1;
    for (let f = 0; f < FLOORS; f++) for (let g = 0; g < GULLAS; g++) { const fr = CELL_CAP - cellSum(cells[ch][f][g]); if (fr > bf) { bf = fr; best = { f, g }; } }
    return best;
  }
  const locLabel = (ch, parts) => {
    if (!parts || !parts.length) return '';
    const one = p => 'F' + (p.f + 1) + ' · G' + pad(p.g + 1, 2);
    return 'C' + (ch + 1) + ' · ' + one(parts[0]) + (parts.length > 1 ? ' → ' + one(parts[parts.length - 1]) : '');
  };
  // Search: every typed word must match name, village, mobile digits or a lot no. Case-insensitive, partial.
  function ownerMatches(o, q, lotIds) {
    const words = norm(q).split(' ').filter(Boolean);
    if (!words.length) return true;
    const hay = norm(o.name + ' ' + o.village + ' ' + (lotIds || []).join(' '));
    const mob = digits(o.mobile);
    return words.every(w => hay.includes(w) || (/^\d{3,}$/.test(w) && mob.includes(w)));
  }

  // Apply a payment to advances: interest first, then principal (oldest first). Whatever is left
  // is carried forward from today, so interest is never counted twice.
  function settleAdvances(list, pay) {
    if (!list || !list.length || !(pay > 0)) return list || [];
    const rows = list.map(a => ({ ...a, int: interestOf(a).val })).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    const totInt = rows.reduce((s, r) => s + r.int, 0);
    let p = pay;
    const intPaid = Math.min(p, totInt); p -= intPaid;
    const unpaidInt = totInt - intPaid;
    const out = [];
    rows.forEach(r => { const cut = Math.min(p, r.amt); p -= cut; const left = Math.round(r.amt - cut); if (left > 0) out.push({ date: iso(TODAY), amt: left, carry: true, noInt: !!r.noInt, byaj: !!r.byaj }); });
    if (unpaidInt > 0) out.push({ date: iso(TODAY), amt: Math.round(unpaidInt), noInt: true, carry: true, byaj: true });
    return out;
  }

  /* ---------------- language ---------------- */
  const DICT = {
    en: {
      tagline: 'Bhojpura, Niwari (M.P.)', demo: 'Demo · Sample data', plant: 'Bhojpura, Niwari (M.P.)', live: 'LIVE',
      nav_dash: 'Dashboard', nav_in: 'Gadi Inward', nav_map: 'Chamber Map', nav_khata: 'Kisan Khata & Bill',
      nav_dash_s: 'Live stock & vasooli', nav_in_s: 'Nayi gadi aawak', nav_map_s: 'Rack-wise bori stock', nav_khata_s: 'Byaj, nikasi & gate pass',
      bn_dash: 'Dashboard', bn_in: 'Inward', bn_map: 'Chamber', bn_khata: 'Khata & Bill',
      shortcuts: 'Keyboard: Alt + 1 / 2 / 3 / 4',
      greet: 'AMT COLD STORAGE — BHOJPURA, NIWARI (M.P.)', dash_sub: 'Daily Live Operations & Stock Dashboard', new_gadi: 'Nayi Gadi',
      kpi_stock: 'Total Bori Stock', kpi_in: 'Aaj ki Inward', kpi_out: 'Aaj ka Dispatch', kpi_cash: 'Aaj ki Vasooli',
      cap: 'Capacity', full: 'Full', gadi: 'gadi', gatepass: 'gate pass', payments: 'payment', cash_in_hand: 'Cash in hand', bori: 'Bori', mt: 'MT',
      baaki: 'Market mein baaki Advance + Byaj', kisan: 'kisan', view_khata: 'Khata dekho',

  function Icon({ name, className }) {

  function useIsMobile() {
    const q = '(max-width: 767px)';
    const [m, setM] = useState(() => { try { return window.matchMedia(q).matches; } catch (e) { return false; } });
    useEffect(() => {
      let mq; try { mq = window.matchMedia(q); } catch (e) { return; }
      const h = e => setM(e.matches);
      if (mq.addEventListener) mq.addEventListener('change', h); else mq.addListener(h);
      return () => { if (mq.removeEventListener) mq.removeEventListener('change', h); else mq.removeListener(h); };
    }, []);
    return m;
  }

  function QR({ text, size }) {
    const ref = useRef(null);
    useEffect(() => {
      const el = ref.current; if (!el) return;
      el.innerHTML = '';
      try { new QRCode(el, { text: String(text).slice(0, 120), width: size || 128, height: size || 128, colorDark: '#0F2D59', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }
      catch (e) { el.textContent = 'QR'; }
    }, [text, size]);
    return html`<div ref=${ref} className="qr w-24 h-24 sm:w-28 sm:h-28 shrink-0 bg-white p-1.5 rounded-md border border-navy-100"></div>`;
  }
  function Barcode({ text }) {
    let h = 7; for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
    const r = mulberry32(h); const bars = []; let x = 4;
    bars.push(html`<rect key="s1" x="0" y="0" width="1.5" height="44" fill="#0F2D59"/>`, html`<rect key="s2" x="2.5" y="0" width="1.5" height="44" fill="#0F2D59"/>`);
    while (x < 192) { const w = 1 + Math.floor(r() * 3); bars.push(html`<rect key=${x} x=${x} y="0" width=${w} height="38" fill="#0F2D59"/>`); x += w + 1 + Math.floor(r() * 2.5); }
    bars.push(html`<rect key="e1" x="196" y="0" width="1.5" height="44" fill="#0F2D59"/>`, html`<rect key="e2" x="198.5" y="0" width="1.5" height="44" fill="#0F2D59"/>`);
    return html`<div><svg viewBox="0 0 200 44" className="w-full h-11" preserveAspectRatio="none" role="img" aria-label="Barcode">${bars}</svg><div className="text-center text-[11px] tracking-[0.3em] text-mist num mt-0.5">${text}</div></div>`;

  /* ---------------- Gate Inward ---------------- */

    const [err, setErr] = useState('');
    const [token, setToken] = useState(null);
    const busy = useRef(false);
    const nameRef = useRef(null);
    const known = OWNERS.find(o => norm(o.name) === norm(form.name));
    const set = (k, v) => { setErr(''); setForm(p => ({ ...p, [k]: v })); };
    const onName = v => {
      const o = OWNERS.find(x => norm(x.name) === norm(v));
      setErr(''); setForm(p => ({ ...p, name: v, ...(o ? { mobile: o.mobile, village: o.village } : {}) }));
    };
    const bagsN = toBags(form.bags);
    const chFree = cells.map(c => CH_CAP - chamberSum(c));
    const overChamber = bagsN > 0 && bagsN > chFree[form.ch];
    const plan = bagsN > 0 && !overChamber ? allocate(cells, form.ch, form.f, form.g, bagsN) : null;
    const autoPick = ch => { const b = bestStart(cells, ch); setErr(''); setForm(p => ({ ...p, ch, f: b.f, g: b.g })); };

    const validate = () => {
      if (!norm(form.name)) return t('err_name');
      if (!(bagsN > 0)) return t('err_bags');
      if (bagsN > MAX_BAGS_PER_GADI) return t('err_max', { n: fmt(MAX_BAGS_PER_GADI) });
      const mob = digits(form.mobile);
      if (mob && !/^[6-9]\d{9}$/.test(mob)) return t('err_mobile');
      if (form.vehicle.replace(/[^A-Za-z0-9]/g, '').length < 4) return t('err_vehicle');
      if (overChamber || !plan) return t('err_chamber', { c: form.ch + 1, n: fmt(chFree[form.ch]) });
      return '';
    };
    const submit = e => {
      e.preventDefault();
      if (busy.current) return;
      const msg = validate();
      if (msg) { setErr(msg); notify(msg, 'error'); return; }

      const lot = onSave({ ...form, name: form.name.replace(/\s+/g, ' ').trim(), village: form.village.trim(), mobile: digits(form.mobile), vehicle: form.vehicle.trim(), bags: bagsN, plan });

      // Clear the truck-specific fields at once so a second Enter cannot create a duplicate lot.
      setForm(p => ({ ...p, name: '', village: '', mobile: '', vehicle: '', bags: '' }));

              <${Icon} name="alert" className="w-5 h-5 shrink-0"/><span>${t('err_chamber', { c: form.ch + 1, n: fmt(chFree[form.ch]) })}</span></div>` : null}

  /* ---------------- Kisan Khata & Billing ---------------- */
  // Pure bill math. Every edge case (0 bags, no advance, partial release, advance bigger than bill) resolves here.
  function computeBill({ total, bags, useBd, mode, rate, advSum, intSum, advInput }) {
    const errors = [];
    const typed = String(bags == null ? '' : bags).trim();
    const bN = toBags(typed);
    if (typed !== '' && !isFinite(bN)) errors.push(['err_relnum', { n: fmt(total) }]);
    const b = isFinite(bN) ? bN : 0;
    if (b > total) errors.push(['err_rel', { n: fmt(total) }]);
    const bb = Math.max(0, Math.min(b, total));
    const rent = bb * RATE.rent, ham = bb * RATE.hamali, bd = useBd ? bb * RATE.bardana : 0;
    const charges = rent + ham + bd;
    const advDue = safe(advSum) + safe(intSum);
    let advPay = 0, collect = 0, payOut = 0, saleVal = 0, afterCharges = 0;
    if (mode === 'cash') {
      const raw = String(advInput == null ? '' : advInput).trim();
      const a = raw === '' ? 0 : toMoney(raw);
      if (!isFinite(a) || a < 0 || a > advDue) errors.push(['err_advamt', { n: rs(advDue) }]);
      advPay = isFinite(a) ? Math.max(0, Math.min(advDue, Math.round(a))) : 0;
      collect = charges + advPay;
    } else {
      const r = toMoney(rate);
      if (bb > 0 && (!isFinite(r) || r <= 0)) errors.push(['err_rate']);
      saleVal = bb * (isFinite(r) ? r : 0);
      afterCharges = saleVal - charges;
      if (afterCharges >= 0) { advPay = Math.min(afterCharges, advDue); payOut = afterCharges - advPay; }
      else { advPay = 0; collect = -afterCharges; }
    }
    advPay = Math.round(advPay);
    const advLeft = Math.max(0, Math.round(advDue - advPay));
    if (bb === 0 && advPay === 0 && !errors.length) errors.push(['err_nothing']);
    return { b: bb, rent, ham, bd, charges, advDue, advPay, advLeft, collect: Math.round(collect), payOut: Math.round(payOut), saleVal, afterCharges, remain: Math.max(0, total - bb), errors };
  }

      return m;
    }, [cells]);
    const results = OWNERS.filter(o => ownerMatches(o, q, (stockBy[o.id] || []).map(l => l.id)))

    const o = OWNERS[farmer] || OWNERS[0];

    const advSum = advRows.reduce((a, r) => a + safe(r.amt), 0), intSum = advRows.reduce((a, r) => a + r.val, 0);
    const advDue = advSum + intSum;

  /* ---------------- App shell ---------------- */
  const TABS = ['dash', 'in', 'map', 'khata'];
  const TAB_ICON = { dash: 'home', in: 'truck', map: 'snow', khata: 'wallet' };

  function App() {
    const isMobile = useIsMobile();
    const boot = useMemo(() => { const s = loadState(); if (s) { applyExtraOwners(s.extra); return { ...s, restored: true }; } applyExtraOwners([]); return { ...freshState(), restored: false }; }, []);
    const [lang, setLang] = useState(() => { try { return localStorage.getItem('amt-lang') === 'hi' ? 'hi' : 'en'; } catch (e) { return 'en'; } });
    const [tab, setTab] = useState(() => { const h = (location.hash || '').slice(1); return TABS.includes(h) ? h : 'dash'; });
    const [cells, setCells] = useState(boot.cells);
    const [events, setEvents] = useState(boot.events);
    const [adv, setAdv] = useState(boot.adv);
    const [nextLot, setNextLot] = useState(boot.nextLot);
    const [counters, setCounters] = useState(boot.counters);
    const [extra, setExtra] = useState(boot.extra);
    const [farmer, setFarmer] = useState(0);
    const [mapCh, setMapCh] = useState(2);
    const [toast, setToast] = useState(null);
    const [askReset, setAskReset] = useState(false);
    const [canSave, setCanSave] = useState(true);
    const [temps, setTemps] = useState(CH_TEMP);
    const [tick, setTick] = useState(() => new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    const [ver, setVer] = useState(0);
    const skipFirstSave = useRef(!boot.restored);

    const t = useCallback((k, v) => { let s = (DICT[lang][k] != null ? DICT[lang][k] : (DICT.en[k] != null ? DICT.en[k] : k)); if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]); return s; }, [lang]);
    const changeLang = l => { setLang(l); try { localStorage.setItem('amt-lang', l); } catch (e) { } };
    const notify = useCallback((msg, kind) => setToast({ msg, kind: kind || 'ok', id: Date.now() + Math.random() }), []);
    useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), toast.kind === 'error' ? 4500 : 3600); return () => clearTimeout(id); }, [toast]);
    useEffect(() => { document.documentElement.lang = lang === 'hi' ? 'hi' : 'en'; }, [lang]);

    // Persist every change to this browser (the untouched sample is not written).
    useEffect(() => {
      if (skipFirstSave.current) { skipFirstSave.current = false; return; }
      const ok = saveState({ cells, events: events.slice(0, 60).map(e => { const { fresh, ...rest } = e; return rest; }), adv, nextLot, counters, extra });
      setCanSave(ok);
    }, [cells, events, adv, nextLot, counters, extra]);

    const goto = useCallback((tb, ch) => { if (typeof ch === 'number') setMapCh(ch); setTab(tb); try { history.replaceState(null, '', '#' + tb); } catch (e) { } window.scrollTo({ top: 0 }); }, []);

    useEffect(() => {
      const k = e => { if (e.altKey && ['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); goto(TABS[Number(e.key) - 1]); } };
      window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
    }, [goto]);

    // Ignore a tap that lands while the finger is still scrolling (prevents accidental clicks on phones).
    useEffect(() => {
      let startX = 0, startY = 0, moved = false, lastTouch = 0, lastScroll = 0;
      const ts = e => { const p = e.touches && e.touches[0]; if (!p) return; startX = p.clientX; startY = p.clientY; moved = false; lastTouch = Date.now(); };
      const tm = e => { const p = e.touches && e.touches[0]; if (!p) return; if (Math.abs(p.clientX - startX) > 10 || Math.abs(p.clientY - startY) > 10) moved = true; };
      const sc = () => { if (Date.now() - lastTouch < 1500) lastScroll = Date.now(); };
      const ck = e => {
        if (Date.now() - lastTouch > 800) return;
        if (moved || (lastScroll && Date.now() - lastScroll < 100)) { e.preventDefault(); e.stopPropagation(); moved = false; }
      };
      window.addEventListener('touchstart', ts, { passive: true, capture: true });
      window.addEventListener('touchmove', tm, { passive: true, capture: true });
      document.addEventListener('scroll', sc, { passive: true, capture: true });
      window.addEventListener('click', ck, true);
      return () => {
        window.removeEventListener('touchstart', ts, { capture: true });
        window.removeEventListener('touchmove', tm, { capture: true });
        document.removeEventListener('scroll', sc, { capture: true });
        window.removeEventListener('click', ck, true);
      };
    }, []);

    useEffect(() => {
      const id = setInterval(() => {
        setTemps(prev => prev.map((v, i) => { const n = v + (Math.random() - 0.5) * 0.2; return Math.min(CH_TEMP[i] + 0.3, Math.max(CH_TEMP[i] - 0.3, n)); }));
        setTick(new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      }, 5000);
      return () => clearInterval(id);
    }, []);

    const saveInward = form => {
      const id = lotNo(nextLot);
      let oi = (OWNERS.find(o => norm(o.name) === norm(form.name)) || {}).id;
      if (oi == null) {
        const rec = { name: form.name, village: form.village || '—', mobile: form.mobile || '' };
        OWNERS.push({ id: OWNERS.length, w: 0, ...rec }); oi = OWNERS.length - 1;
        setExtra(x => [...x, rec]);
      }
      const next = cloneCells(cells);
      form.plan.forEach(p => next[form.ch][p.f][p.g].push({ id, owner: oi, bags: p.n, com: form.com, date: iso(TODAY) }));
      setCells(next);
      setNextLot(n => n + 1);
      const time = nowTime();
      setEvents(ev => [{ id: 'n' + Date.now(), fresh: true, time, type: 'in', owner: form.name, vehicle: form.vehicle, bags: form.bags, com: form.com, place: 'C' + (form.ch + 1) + ' · F' + (form.plan[0].f + 1) }, ...ev]);
      notify(t('done_in', { id, n: fmt(form.bags) }));
      return { id, name: form.name, village: form.village, mobile: form.mobile, vehicle: form.vehicle, bags: form.bags, com: form.com, bardana: form.bardana, loc: locLabel(form.ch, form.plan), time };
    };

    const finalizeBill = ({ owner, bags, advPay, cashIn, vehicle, gp, com }) => {
      const time = nowTime(); const name = OWNERS[owner].name;
      const evs = [];
      if (bags > 0) {
        const next = cloneCells(cells);
        const refs = [];
        next.forEach(c => c.forEach(fl => fl.forEach(lots => lots.forEach(l => { if (l.owner === owner) refs.push(l); }))));
        refs.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
        let rem = bags;
        for (const l of refs) { if (rem <= 0) break; const take = Math.min(l.bags, rem); l.bags -= take; rem -= take; }
        next.forEach(c => c.forEach(fl => fl.forEach((lots, g) => { fl[g] = lots.filter(l => l.bags > 0); })));
        setCells(next);
        evs.push({ id: 'o' + Date.now(), fresh: true, time, type: 'out', owner: name, vehicle: vehicle || '—', bags, com, place: gp });
        setCounters(c => ({ bill: c.bill + 1, gp: c.gp + 1 }));
      } else {
        setCounters(c => ({ ...c, bill: c.bill + 1 }));
      }
      if (advPay > 0) setAdv(a => ({ ...a, [owner]: settleAdvances(a[owner], advPay) }));
      if (cashIn > 0) evs.unshift({ id: 'p' + Date.now(), fresh: true, time, type: 'pay', owner: name, amt: cashIn, note: 'Cash' + (bags > 0 ? ' · ' + gp : '') });
      if (evs.length) setEvents(ev => [...evs, ...ev]);
      notify(bags > 0 ? t('done_out', { n: fmt(bags), gp }) : t('done_adv', { amt: rs(advPay) }));
    };

    const doReset = () => {
      const s = freshState();
      applyExtraOwners([]);
      try { localStorage.removeItem(STORE_KEY); } catch (e) { }
      skipFirstSave.current = true;
      setCells(s.cells); setEvents(s.events); setAdv(s.adv); setNextLot(s.nextLot); setCounters(s.counters); setExtra([]);
      setFarmer(0); setMapCh(2); setAskReset(false); setVer(v => v + 1); setCanSave(true);
      notify(t('reset_done'));
    };

    const openKhata = id => { setFarmer(id); goto('khata'); };
    const navLabel = { dash: t('nav_dash'), in: t('nav_in'), map: t('nav_map'), khata: t('nav_khata') };
    const navSub = { dash: t('nav_dash_s'), in: t('nav_in_s'), map: t('nav_map_s'), khata: t('nav_khata_s') };
    const navShort = { dash: t('bn_dash'), in: t('bn_in'), map: t('bn_map'), khata: t('bn_khata') };
    const mainPad = tab === 'khata' ? 'pb-48' : tab === 'dash' ? 'pb-36' : 'pb-28';

    return html`<div className="min-h-full">
      <header className="top-bar sticky z-40 bg-navy text-white shadow-md no-select">
        <div className="mx-auto max-w-[1400px] px-4 md:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
          <div className="flex items-center gap-2.5 min-w-0">
            <span className="grid place-items-center w-9 h-9 md:w-10 md:h-10 shrink-0 rounded-xl bg-amt text-white"><${Icon} name="snow" className="w-5 h-5 md:w-6 md:h-6"/></span>
            <div className="min-w-0">
              <div className="font-display text-[17px] md:text-xl font-bold leading-none tracking-tight truncate">AMT COLD STORAGE</div>
              <div className="mt-1 flex items-center gap-1.5 text-[11px] md:text-xs text-navy-200 min-w-0">
                <span className="inline-flex shrink-0 items-center gap-1 rounded-full bg-emerald-500/20 px-1.5 py-px font-bold text-emerald-300"><span className="live-dot w-1.5 h-1.5 rounded-full bg-emerald-400"></span>${t('live')}</span>
                <span className="truncate">${t('tagline')}</span>
              </div>
            </div>
          </div>
          <div className="flex items-center gap-1.5 md:gap-3 shrink-0">
            <span className="hidden lg:inline-flex items-center rounded-full border border-amt/60 bg-amt/15 px-2.5 py-1 text-xs font-semibold text-amt-200">${t('demo')}</span>
            <button onClick=${() => setAskReset(true)} className="inline-flex items-center justify-center gap-1.5 min-h-[40px] min-w-[40px] rounded-lg bg-white/10 px-2 md:px-3 text-sm font-semibold text-navy-100 hover:bg-white/20" aria-label=${t('reset')} title=${t('reset')}>
              <${Icon} name="reset" className="w-4 h-4"/><span className="hidden md:inline">${t('reset')}</span>
            </button>
            <div className="inline-flex rounded-lg bg-white/10 p-0.5" role="group" aria-label="Language">
              ${[['en', 'EN'], ['hi', 'हिंदी']].map(([k, l]) => html`<button key=${k} onClick=${() => changeLang(k)} aria-pressed=${lang === k}
                className=${'min-h-[36px] rounded-md px-2 md:px-2.5 text-sm font-semibold ' + (lang === k ? 'bg-white text-navy' : 'text-navy-100 hover:text-white')}>${l}</button>`)}
            </div>
          </div>
        </div>
      </header>

      <div className="mx-auto max-w-[1400px] md:grid md:grid-cols-[232px_minmax(0,1fr)]">
        <nav className="hidden md:block sticky top-16 self-start h-[calc(100vh-4rem)] overflow-y-auto border-r border-navy-100 bg-white px-3 py-5 no-select">
          <div className="space-y-1">
            ${TABS.map((k, i) => html`<button key=${k} onClick=${() => goto(k)} aria-current=${tab === k ? 'page' : undefined}
              className=${'w-full min-h-[56px] flex items-center gap-3 rounded-xl px-3 py-2 text-left ' + (tab === k ? 'bg-navy text-white shadow-sm' : 'text-ink hover:bg-navy-50')}>
              <span className=${'grid place-items-center w-9 h-9 shrink-0 rounded-lg ' + (tab === k ? 'bg-white/10 text-amt-200' : 'bg-navy-50 text-navy')}><${Icon} name=${TAB_ICON[k]} className="w-5 h-5"/></span>
              <span className="min-w-0 flex-1"><span className="block font-semibold leading-tight">${navLabel[k]}</span><span className=${'block text-xs truncate ' + (tab === k ? 'text-navy-200' : 'text-mist')}>${navSub[k]}</span></span>
              <kbd className=${'text-[11px] font-semibold rounded px-1.5 ' + (tab === k ? 'bg-white/10 text-navy-100' : 'bg-navy-50 text-mist')}>${i + 1}</kbd>
            </button>`)}
          </div>
          <p className="mt-3 px-3 text-xs text-mist">${t('shortcuts')}</p>
          <div className="mt-6 mx-1 rounded-xl bg-canvas p-3 text-xs text-mist space-y-0.5">
            <div className="font-semibold text-navy-700">${t('plant')}</div>
            <div className="num">${t('cap')}: ${fmt(PLANT_CAP)} ${t('bori')} (~5,000 ${t('mt')})</div>
            <div className="num">4 ${t('ch')} · 4 Floor · 10 Gulla</div>
          </div>
          <p className=${'mt-3 px-3 text-[11px] ' + (canSave ? 'text-mist' : 'text-rose-600 font-semibold')}>${canSave ? t('saved_here') : t('not_saved')}</p>
        </nav>

        <main className=${'min-w-0 px-4 md:px-6 lg:px-8 pt-4 md:pt-5 md:pb-12 ' + mainPad}>
          <div className="md:hidden mb-3 flex flex-wrap items-center gap-2">
            <span className="inline-flex items-center rounded-full bg-amt-50 px-2.5 py-0.5 text-xs font-semibold text-amt-700">${t('demo')}</span>
            ${!canSave ? html`<span className="text-[11px] font-semibold text-rose-600">${t('not_saved')}</span>` : null}
          </div>
          <div className="fade-in" key=${tab + '-' + ver}>
            ${tab === 'dash' ? html`<${Dashboard} t=${t} lang=${lang} cells=${cells} events=${events} adv=${adv} temps=${temps} tick=${tick} goto=${goto}/>` : null}
            ${tab === 'in' ? html`<${Inward} t=${t} lang=${lang} cells=${cells} onSave=${saveInward} notify=${notify}/>` : null}
            ${tab === 'map' ? html`<${ChamberMap} t=${t} lang=${lang} cells=${cells} ch=${mapCh} setCh=${setMapCh} openKhata=${openKhata} isMobile=${isMobile}/>` : null}
            ${tab === 'khata' ? html`<${Khata} t=${t} lang=${lang} cells=${cells} adv=${adv} farmer=${farmer} setFarmer=${setFarmer} onFinalize=${finalizeBill} counters=${counters} isMobile=${isMobile}/>` : null}
          </div>
        </main>
      </div>

      ${isMobile && tab === 'dash' ? html`<button onClick=${() => goto('in')} className="above-nav fixed right-4 z-30 inline-flex items-center gap-2 min-h-[52px] rounded-full bg-amt pl-4 pr-5 font-bold text-white shadow-xl" aria-label=${t('new_gadi')}>
        <${Icon} name="plus" className="w-5 h-5"/>${t('new_gadi')}
      </button>` : null}

      <nav className="bottom-nav md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-navy-100 shadow-[0_-4px_16px_rgba(15,45,89,.08)] no-select">
        <div className="grid grid-cols-4 h-[64px]">
          ${TABS.map(k => html`<button key=${k} onClick=${() => goto(k)} aria-current=${tab === k ? 'page' : undefined} className="flex min-w-0 flex-col items-center justify-center gap-1">
            <span className=${'grid place-items-center w-14 h-8 rounded-full ' + (tab === k ? 'bg-navy text-white' : 'text-mist')}><${Icon} name=${TAB_ICON[k]} className="w-5 h-5"/></span>
            <span className=${'max-w-full truncate px-1 text-[11.5px] font-semibold leading-none ' + (tab === k ? 'text-navy' : 'text-mist')}>${navShort[k]}</span>
          </button>`)}
        </div>
      </nav>

      ${askReset ? html`<${Sheet} label=${t('reset_q')} onClose=${() => setAskReset(false)}>
        <div className="p-5 pt-3 md:pt-5 space-y-3">
          <div className="flex items-center gap-3"><span className="grid place-items-center w-11 h-11 shrink-0 rounded-xl bg-amt-50 text-amt-700"><${Icon} name="reset" className="w-5 h-5"/></span><h2 className="font-display text-xl font-bold text-navy">${t('reset_q')}</h2></div>
          <p className="text-mist">${t('reset_d')}</p>
          <div className="grid grid-cols-2 gap-2 pt-1">
            <button onClick=${() => setAskReset(false)} className="min-h-[52px] rounded-xl border border-navy-200 font-bold text-navy hover:bg-navy-50">${t('cancel')}</button>
            <button onClick=${doReset} className="min-h-[52px] rounded-xl bg-rose-600 font-bold text-white hover:bg-rose-700">${t('yes_reset')}</button>
          </div>
        </div>
      <//>` : null}

      ${toast ? html`<div key=${toast.id} className="toast-pos fixed z-[60] left-4 right-4 md:left-1/2 md:right-auto md:-translate-x-1/2 md:w-[28rem] pop-in" role=${toast.kind === 'error' ? 'alert' : 'status'}>
        <div className=${'flex items-start gap-3 rounded-2xl px-4 py-3 shadow-2xl text-white ' + (toast.kind === 'error' ? 'bg-rose-600' : 'bg-ink')}>
          <span className=${'grid place-items-center w-6 h-6 shrink-0 rounded-full ' + (toast.kind === 'error' ? 'bg-white/20' : toast.kind === 'info' ? 'bg-sky-500' : 'bg-emerald-500')}><${Icon} name=${toast.kind === 'error' ? 'alert' : 'check'} className="w-4 h-4"/></span>
          <span className="text-sm font-medium">${toast.msg}</span>
        </div>
      </div>` : null}
    </div>`;
  }

  // Expose the pure bill math for a quick self-check in tests; harmless in the page.
  window.__amt = { computeBill, settleAdvances, interestOf, ownerMatches, toBags, allocate };
  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
